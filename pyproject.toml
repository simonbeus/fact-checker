[project]
name = "fact-check-api"
version = "0.1.0"
description = "Scalable Fact-Checking API using FastAPI, Pydantic-AI, Mistral, and Tavily"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai>=0.0.24",
    "mistralai>=1.2.0",
    "tavily-python>=0.5.0",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Allow FastAPI Depends() in parameter defaults
    "B904",  # Allow raising HTTPException without from exc in handlers
    "E501",  # Line length handled by formatter
]



